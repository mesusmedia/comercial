<style>
:root {
  --bg:#0D1117;--surface:#161B27;--surface-2:#1C2233;--border:#1E2636;--border-2:#28324A;
  --text:#E4E8F4;--text-2:#8B95B0;--text-3:#5A6280;
  --accent:#4C6EF5;--accent-dim:rgba(76,110,245,.12);
  --green:#1FD68A;--green-dim:rgba(31,214,138,.10);
  --amber:#F0B429;--amber-dim:rgba(240,180,41,.10);
  --red:#F05252;--red-dim:rgba(240,82,82,.10);
  --font-d:'Syne',sans-serif;--font-b:'DM Sans',sans-serif;--font-m:'JetBrains Mono',monospace;
  --r:8px;--r-lg:12px;
}
:root[data-theme="light"]{--bg:#F2F4F9;--surface:#FFFFFF;--surface-2:#F7F8FC;--border:#E2E6F0;--border-2:#CDD3E8;--text:#0D1117;--text-2:#4A5278;--text-3:#8B95B0;--accent-dim:rgba(76,110,245,.08);--green-dim:rgba(31,214,138,.08);--amber-dim:rgba(240,180,41,.08);--red-dim:rgba(240,82,82,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* Login */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:40px;width:100%;max-width:380px}
.login-title{font-family:var(--font-d);font-size:1.4rem;font-weight:800;margin-bottom:6px;color:var(--text)}
.login-sub{font-size:.82rem;color:var(--text-3);margin-bottom:28px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:.72rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:500}
.login-field input{width:100%;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:var(--font-b);font-size:.9rem;outline:none;transition:border-color .15s}
.login-field input:focus{border-color:var(--accent)}
.login-field input::placeholder{color:var(--text-3)}
.login-err{color:var(--red);font-size:.78rem;margin-bottom:12px;display:none}
.login-btn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-family:var(--font-b);font-size:.9rem;font-weight:500;cursor:pointer;transition:background .15s}
.login-btn:hover{background:#3b5bdb}
.login-loading{display:none;text-align:center;color:var(--text-3);font-size:.82rem;margin-top:12px}

/* Dashboard */
.shell{max-width:1400px;margin:0 auto;padding:0 24px 48px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.brand{font-family:var(--font-d);font-size:1.25rem;font-weight:800;letter-spacing:-.02em;color:var(--text);display:flex;align-items:center;gap:8px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.brand-sub{font-weight:400;color:var(--text-2);font-size:.85rem;letter-spacing:.02em}
.header-right{display:flex;align-items:center;gap:20px}
.header-meta{text-align:right}
.header-date{font-family:var(--font-m);font-size:.78rem;color:var(--text-2)}
.header-updated{font-size:.72rem;color:var(--text-3);margin-top:2px}
.header-actions{display:flex;gap:8px}
.btn-icon{background:var(--surface);border:1px solid var(--border);color:var(--text-2);padding:6px 12px;border-radius:var(--r);cursor:pointer;font-family:var(--font-b);font-size:.78rem;transition:border-color .15s,color .15s}
.btn-icon:hover{border-color:var(--border-2);color:var(--text)}

/* Summary */
.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:24px 0 20px}
@media(max-width:900px){.summary{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.summary{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--tile-accent,var(--accent))}
.tile-label{font-size:.72rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
.tile-value{font-family:var(--font-m);font-size:1.75rem;font-weight:500;color:var(--text);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1}
.tile-sub{font-size:.72rem;color:var(--text-3);margin-top:4px}
.tile-green{--tile-accent:var(--green)}.tile-amber{--tile-accent:var(--amber)}.tile-red{--tile-accent:var(--red)}.tile-accent{--tile-accent:var(--accent)}

/* Period selector */
.period-bar{display:flex;align-items:center;gap:12px;padding:0 0 20px;flex-wrap:wrap}
.period-label{font-size:.78rem;color:var(--text-3);font-weight:500}
.period-select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:7px 12px;color:var(--text);font-family:var(--font-b);font-size:.82rem;cursor:pointer;outline:none}
.period-select:focus{border-color:var(--accent)}

/* Filters */
.filters{display:flex;align-items:center;gap:12px;padding:4px 0 20px;flex-wrap:wrap}
.search{flex:1;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px 12px;color:var(--text);font-family:var(--font-b);font-size:.85rem;outline:none;transition:border-color .15s}
.search::placeholder{color:var(--text-3)}
.search:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-family:var(--font-b);font-size:.78rem;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-green.active{background:var(--green);border-color:var(--green);color:#0D1117}
.chip-amber.active{background:var(--amber);border-color:var(--amber);color:#0D1117}
.chip-red.active{background:var(--red);border-color:var(--red);color:#fff}
.chip-count{background:rgba(255,255,255,.15);border-radius:10px;padding:1px 6px;font-family:var(--font-m);font-size:.68rem}
.chip-green .chip-count,.chip-amber .chip-count{background:rgba(0,0,0,.12)}

/* Grid */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.empty-state{grid-column:1/-1;text-align:center;color:var(--text-3);padding:60px 0;font-size:.9rem}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);border-left:3px solid var(--card-color,var(--border));overflow:hidden;transition:border-color .15s,transform .1s;cursor:default}
.card:hover{border-color:var(--card-color,var(--border-2));transform:translateY(-1px)}
.card.green{--card-color:var(--green)}.card.amber{--card-color:var(--amber)}.card.red{--card-color:var(--red)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 10px;gap:8px}
.card-name{font-family:var(--font-d);font-size:.88rem;font-weight:600;color:var(--text);line-height:1.3;word-break:break-word}
.card-id{font-family:var(--font-m);font-size:.65rem;color:var(--text-3);margin-top:2px}
.status-badge{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 7px;border-radius:12px;font-size:.7rem;font-weight:500;white-space:nowrap}
.status-badge.green{background:var(--green-dim);color:var(--green)}
.status-badge.amber{background:var(--amber-dim);color:var(--amber)}
.status-badge.red{background:var(--red-dim);color:var(--red)}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.card-metrics{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.metric{padding:10px 10px;border-right:1px solid var(--border);text-align:center}
.metric:last-child{border-right:none}
.metric-val{font-family:var(--font-m);font-size:.85rem;font-weight:500;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.metric-val.good{color:var(--green)}.metric-val.warn{color:var(--amber)}.metric-val.bad{color:var(--red)}
.metric-lbl{font-size:.58rem;color:var(--text-3);margin-top:3px;white-space:nowrap}
.card-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px}
.alerts{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text-3)}
.alert-count{background:var(--red-dim);color:var(--red);border-radius:10px;padding:1px 7px;font-family:var(--font-m);font-size:.68rem;font-weight:500}
.alert-count.zero{background:var(--green-dim);color:var(--green)}
.card-seg{font-size:.66rem;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:2px 7px}

/* Loading overlay */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;font-size:.9rem;color:var(--text-3)}

::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px}
@media(prefers-reduced-motion:reduce){.card,.chip,.btn-icon,.search{transition:none}}

function doLogin() {
  const u = document.getElementById('inp-user').value.trim().toLowerCase();
  const p = document.getElementById('inp-pass').value;
  if (USERS[u] && USERS[u] === p) {
    sessionStorage.setItem('l3m_auth', JSON.stringify({ user: u, ts: Date.now() }));
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = '';
    loadData();
  } else {
    document.getElementById('login-err').style.display = 'block';
    setTimeout(() => { document.getElementById('login-err').style.display = 'none'; }, 3000);
  }
}

function doLogout() {
  sessionStorage.removeItem('l3m_auth');
  location.reload();
}

  const a = sessionStorage.getItem('l3m_auth');

  const { ts } = JSON.parse(a);

  document.getElementById('dashboard').style.display = '';
  return true;
}

function getPeriodDates() {
  const sel = document.getElementById('period-select').value;
  const now = new Date();
  let from;
  if (sel === 'month') {
    from = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (sel === 'quarter') {
    const q = Math.floor(now.getMonth() / 3);
    from = new Date(now.getFullYear(), q * 3, 1);
  } else {
    from = new Date(2020, 0, 1);
  }
  return {
    from: from.toISOString().split('T')[0],
    to: now.toISOString().split('T')[0],
  };
}

  if (!API_URL) {

  overlay.style.display = 'flex';
  try {
    const { from, to } = getPeriodDates();
    const res = await fetch(`${API_URL}?from=${from}&to=${to}`);
    const data = await res.json();
    CLIENTS = data.clients || [];
    renderAll();
  } catch (err) {
    console.error('Erro ao carregar dados, usando fallback:', err);
    CLIENTS = FALLBACK_CLIENTS;
    renderAll();
  } finally {
    overlay.style.display = 'none';
  }
}

/* ── Classify ─────────────────────────────────────────────── */
function classify(c) {
  // Alertas = conversas sem resposta há mais de 24h no período
  // Agend = leads que marcaram consulta (verificado no Chatwoot)
  // Comp  = leads que compareceram (verificado no Chatwoot)
  // Venda = leads que fecharam pagamento (verificado no Chatwoot)
  if (c.alerts >= 3 || c.pct_agend < 25 || c.pct_comp < 50 || c.pct_venda < 30) return 'red';
  if (c.alerts >= 1 || c.pct_agend < 40 || c.pct_comp < 65 || c.pct_venda < 50) return 'amber';
  return 'green';
}

/* ── Summary ──────────────────────────────────────────────── */
function renderSummary() {
  const total = CLIENTS.length;
  const totalLeads = CLIENTS.reduce((a,c) => a + c.leads, 0);
  const totalAlerts = CLIENTS.reduce((a,c) => a + c.alerts, 0);
  const greens = CLIENTS.filter(c => classify(c) === 'green').length;
  const ambers = CLIENTS.filter(c => classify(c) === 'amber').length;
  const reds = CLIENTS.filter(c => classify(c) === 'red').length;

  document.getElementById('summary').innerHTML = `
    <div class="tile tile-accent">
      <div class="tile-label">Leads no período</div>
      <div class="tile-value">${totalLeads}</div>
      <div class="tile-sub">${total} clientes ativos</div>
    </div>
    <div class="tile tile-green">
      <div class="tile-label">Saudável</div>
      <div class="tile-value">${greens}</div>
      <div class="tile-sub">acima do benchmark</div>
    </div>
    <div class="tile tile-amber">
      <div class="tile-label">Atenção</div>
      <div class="tile-value">${ambers}</div>
      <div class="tile-sub">monitorar</div>
    </div>
    <div class="tile tile-red">
      <div class="tile-label">Gargalo</div>
      <div class="tile-value">${reds}</div>
      <div class="tile-sub">ação imediata</div>
    </div>
    <div class="tile">
      <div class="tile-label">Alertas ativos</div>
      <div class="tile-value">${totalAlerts}</div>
      <div class="tile-sub">sem resposta > 24h</div>
    </div>
  `;

  document.getElementById('cnt-all').textContent = total;
  document.getElementById('cnt-green').textContent = greens;
  document.getElementById('cnt-amber').textContent = ambers;
  document.getElementById('cnt-red').textContent = reds;
}

/* ── Cards ────────────────────────────────────────────────── */
function rateClass(val, good, warn) {
  if (val >= good) return 'good';
  if (val >= warn) return 'warn';
  return 'bad';
}

function cardHTML(c) {
  const status = classify(c);
  const labels = { green:'Saudável', amber:'Atenção', red:'Gargalo' };
  return `
    <div class="card ${status}" data-status="${status}" data-name="${c.name.toLowerCase()} ${c.id.toLowerCase()}">
      <div class="card-head">
        <div>
          <div class="card-name">${c.name}</div>
          <div class="card-id">${c.id}</div>
        </div>
        <div class="status-badge ${status}">
          <span class="status-dot"></span>${labels[status]}
        </div>
      </div>
      <div class="card-metrics">
        <div class="metric">
          <div class="metric-val">${c.leads}</div>
          <div class="metric-lbl">leads</div>
        </div>
        <div class="metric">
          <div class="metric-val ${rateClass(c.pct_agend,40,25)}">${c.pct_agend}%</div>
          <div class="metric-lbl">agend.</div>
        </div>
        <div class="metric">
          <div class="metric-val ${rateClass(c.pct_comp,70,50)}">${c.pct_comp}%</div>
          <div class="metric-lbl">comparec.</div>
        </div>
        <div class="metric">
          <div class="metric-val ${rateClass(c.pct_venda,50,30)}">${c.pct_venda}%</div>
          <div class="metric-lbl">venda</div>
        </div>
        <div class="metric">
          <div class="metric-val">${c.resp_h}h</div>
          <div class="metric-lbl">resp.</div>
        </div>
      </div>
      <div class="card-foot">
        <div class="alerts">
          <span class="alert-count ${c.alerts === 0 ? 'zero' : ''}">${c.alerts === 0 ? '✓' : c.alerts}</span>
          ${c.alerts === 0 ? 'sem alertas' : `alerta${c.alerts > 1 ? 's' : ''}`}
        </div>
        <div class="card-seg">${c.seg}</div>
      </div>
    </div>
  `;
}

/* ── Filters ──────────────────────────────────────────────── */
let activeFilter = 'all';

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.chip').forEach(el => {
    el.classList.toggle('active', el.dataset.filter === f);
  });
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.card').forEach(el => {
    const matchStatus = activeFilter === 'all' || el.dataset.status === activeFilter;
    const matchSearch = !q || el.dataset.name.includes(q);
    el.style.display = (matchStatus && matchSearch) ? '' : 'none';
  });
  const visible = document.querySelectorAll('.card:not([style*="none"])').length;
  const empty = document.getElementById('empty');
  if (empty) empty.style.display = visible === 0 ? '' : 'none';
}

/* ── Render all ───────────────────────────────────────────── */
function renderAll() {
  renderSummary();
  const grid = document.getElementById('grid');
  const sorted = [...CLIENTS].sort((a,b) => {
    const order = { red:0, amber:1, green:2 };
    return order[classify(a)] - order[classify(b)];
  });
  grid.innerHTML = sorted.map(cardHTML).join('') +
    `<div class="empty-state" id="empty" style="display:none">Nenhum cliente encontrado.</div>`;

  const now = new Date();
  document.getElementById('hdr-date').textContent =
    now.toLocaleDateString('pt-BR', { day:'2-digit', month:'short', year:'numeric' });
  document.getElementById('hdr-updated').textContent =
    `Atualizado às ${now.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' })}`;
}

/* ── Theme ────────────────────────────────────────────────── */
function toggleTheme() {
  const root = document.documentElement;
  root.setAttribute('data-theme', root.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
}

/* ── Init ─────────────────────────────────────────────────── */
if (checkAuth()) {
  loadData();
}
</script>
</body>
</html>
